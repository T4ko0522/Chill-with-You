name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix flake check

  plugins:
    needs: test
    runs-on: ubuntu-latest
    env:
      GAME_ASSEMBLIES_URL: ${{ vars.GAME_ASSEMBLIES_URL }}
      GAME_ASSEMBLIES_SHA256: ${{ vars.GAME_ASSEMBLIES_SHA256 }}
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Build BepInEx payload
        run: nix build .#payload --out-link result-payload
      - name: Download game assemblies
        shell: bash
        run: |
          set -euo pipefail
          : "${GAME_ASSEMBLIES_URL:?Set the GAME_ASSEMBLIES_URL repository variable}"
          : "${GAME_ASSEMBLIES_SHA256:?Set the GAME_ASSEMBLIES_SHA256 repository variable}"
          mkdir -p .ci/references
          curl --fail --location --silent --show-error \
            "$GAME_ASSEMBLIES_URL" \
            --output .ci/game-assemblies.zip
          printf '%s  %s\n' \
            "$GAME_ASSEMBLIES_SHA256" \
            .ci/game-assemblies.zip | sha256sum --check --strict
          unzip -q .ci/game-assemblies.zip -d .ci/references
      - name: Prepare managed assemblies
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assemblies < <(
            find .ci/references -type f -name Assembly-CSharp.dll -print0
          )
          if [[ "${#assemblies[@]}" -ne 1 ]]; then
            printf 'Expected exactly one Assembly-CSharp.dll, found %s\n' \
              "${#assemblies[@]}" >&2
            exit 1
          fi
          managed_source="$(dirname "${assemblies[0]}")"
          managed_target=".ci/game/Chill With You_Data/Managed"
          mkdir -p "$managed_target" dist
          cp "$managed_source"/*.dll "$managed_target"/
      - name: Build plugins
        run: |
          nix develop --command python install_spotify.py \
            .ci/game \
            --payload result-payload \
            --build-only dist/ChillSpotify.dll
          nix develop --command python install_outfit.py \
            .ci/game \
            --payload result-payload \
            --build-only dist/ChillDefaultOutfit.dll
          test -s dist/ChillSpotify.dll
          test -s dist/ChillDefaultOutfit.dll
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: dist/*.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plugins
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugins
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dll --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dll \
              --verify-tag \
              --generate-notes
          fi
